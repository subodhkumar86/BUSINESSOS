services:
  api:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set a managed PostgreSQL connection URL}
      REDIS_URL: ${REDIS_URL:?Set a managed Redis connection URL}
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS web application origin}
      COOKIE_SECURE: "true"
      PORT: "3001"
      API_HOST: "0.0.0.0"
    expose:
      - "3001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

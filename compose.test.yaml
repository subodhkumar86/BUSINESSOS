services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: businessos_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_admin_only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres-test-init.sql:/docker-entrypoint-initdb.d/01-test-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d businessos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1::6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

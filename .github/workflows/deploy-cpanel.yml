name: Deploy to cPanel

# Push to live: every push to main asks cPanel to pull the new commit and run the tasks
# in .cpanel.yml (install, build, migrate, restart).
#
# One-time setup (GitHub > Settings > Secrets and variables > Actions > New repository secret):
#   CPANEL_HOST  business122.web-hosting.com
#   CPANEL_USER  swadqgik
#   CPANEL_TOKEN a cPanel API token created in cPanel > Security > Manage API Tokens
#
# The first deployment needs a dedicated cPanel token stored as a GitHub Action secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USER: ${{ secrets.CPANEL_USER }}
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      # Repository path shown in cPanel > Git Version Control > Repository Path.
      CPANEL_REPO_PATH: /home/swadqgik/businessos-production
      HEALTHCHECK_URL: https://demo.businessos.swad.cloud/api/v1/health
    steps:
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -z "${CPANEL_HOST}" ] || [ -z "${CPANEL_USER}" ] || [ -z "${CPANEL_TOKEN}" ]; then
            echo "::error::Deployment is not configured. Add CPANEL_HOST, CPANEL_USER and CPANEL_TOKEN under GitHub Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger cPanel deployment
        if: steps.credentials.outputs.ready == 'true'
        env:
          REPO_PATH: ${{ env.CPANEL_REPO_PATH }}
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --get --data-urlencode "repository_root=${REPO_PATH}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create")
          echo "$response"
          if ! printf '%s' "$response" | grep -q '"status":1'; then
            echo "::error::cPanel refused the deployment. Check the response above and the last deployment log in cPanel > Git Version Control."
            exit 1
          fi
          log_path=$(printf '%s' "$response" | sed -n 's/.*"log_path":"\([^"]*\)".*/\1/p')
          echo "::notice::Deployment queued. Server log: ${log_path:-see cPanel > Git Version Control > Last Deployment}"
      - name: Verify live health endpoint
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            response=$(curl --silent --show-error --max-time 15 "${HEALTHCHECK_URL}" || true)
            if printf '%s' "$response" | grep -q '"ok":true'; then
              echo "Live health check passed."
              exit 0
            fi
            echo "Waiting for cPanel deployment/restart ($attempt/18)..."
            sleep 10
          done
          echo "::error::Deployment trigger succeeded but the health endpoint did not become ready. Check cPanel > Git Version Control > Last Deployment and stderr.log."
          exit 1
